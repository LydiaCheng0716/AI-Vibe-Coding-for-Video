name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# 同一分支新推送时取消旧的在跑任务，省额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: typecheck · coverage · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps (clean, from lockfile)
        run: npm ci

      - name: Typecheck (lint)
        run: npm run lint

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Bundle size guard
        run: npm run check:bundle

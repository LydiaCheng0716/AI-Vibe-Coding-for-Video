<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="FireUG">
  <!-- 四块拼图：中灰 / 炭灰 / 浅灰 / 品牌红（对齐 FireUG Logo 取色） -->
  <rect x="2" y="2" width="44" height="44" fill="#7f7f7f" />
  <rect x="54" y="2" width="44" height="44" fill="#2f2f2f" />
  <rect x="2" y="54" width="44" height="44" fill="#d2d2d2" />
  <rect x="54" y="54" width="44" height="44" fill="#c0392b" />
  <!-- 白色拼接缝 + 互锁凸点（白环 + 彩心） -->
  <circle cx="50" cy="24" r="10" fill="#ffffff" />
  <circle cx="50" cy="24" r="7" fill="#2f2f2f" />
  <circle cx="50" cy="50" r="10" fill="#ffffff" />
  <circle cx="50" cy="50" r="7" fill="#7f7f7f" />
  <circle cx="76" cy="50" r="10" fill="#ffffff" />
  <circle cx="76" cy="50" r="7" fill="#c0392b" />
  <circle cx="50" cy="76" r="10" fill="#ffffff" />
  <circle cx="50" cy="76" r="7" fill="#d2d2d2" />
</svg>
